# fly.toml app configuration file generated for wieners-react on 2025-03-02T10:20:10-03:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wieners-react'
primary_region = 'yul'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
